name: Bug report
description: Report a reproducible problem in Atoll
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Atoll version or commit
      description: Include the control-server version and agent version when relevant.
      placeholder: v0.1.x or commit SHA
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Install script
        - Build from source
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, browser, and whether this is the control server or a node.
      placeholder: Debian / Ubuntu, amd64 / arm64, browser, node role
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens, cookies, private keys, personal data, and service data before posting. Do not report security vulnerabilities here.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the troubleshooting guide and searched existing issues.
          required: true
        - label: I removed secrets and personal data from the report.
          required: true
