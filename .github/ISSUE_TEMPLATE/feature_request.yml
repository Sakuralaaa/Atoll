name: Feature request
description: Suggest a problem to solve or a capability to explore
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the job or workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Atoll to do?
      description: A short description of the outcome is enough; implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use case and constraints
      description: Include relevant environment, scale, security, and compatibility constraints.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds tried
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap for a similar request.
          required: true
