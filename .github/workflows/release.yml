name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation (Sigstore)
      attestations: write # store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - run: sh internal/server/webui/sync.sh
      - run: go test ./...
      # A tagged build must come from exactly the tagged tree. The only allowed difference is the
      # synced panel in internal/server/webui/dist (a build output that replaces a tracked placeholder).
      - name: Check the tree is clean
        run: |
          if [ -n "$(git status --porcelain -- . ':(exclude)internal/server/webui/dist')" ]; then
            git status --porcelain -- . ':(exclude)internal/server/webui/dist'
            echo "::error::release tree is dirty"; exit 1
          fi
      - run: VERSION=${GITHUB_REF_NAME} sh scripts/build-release.sh
      # Signed build provenance for every binary and SHA256SUMS: SHA256SUMS alone only proves
      # a file was not corrupted, not that this workflow built it. Verify with
      #   gh attestation verify atoll-server-linux-amd64 --repo Sakuralaaa/Atoll
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/atoll-*
            dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          notes=""
          # hand-written upgrade notes come first, the generated commit list after them
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then notes="docs/releases/$GITHUB_REF_NAME.md"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes ${notes:+--notes-file "$notes"} --title "Atoll $GITHUB_REF_NAME" $pre

  # Container image of the control server (deploy/docker/Dockerfile), docs/install-docker.md.
  # Each platform builds on its own native GitHub runner (no QEMU) and pushes by digest; the
  # merge job ties the digests into one multi-arch tag. vX.Y.Z always, latest only for releases
  # without a '-' (pre-releases never move latest).
  image:
    needs: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sakuralaaa/atoll-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Platform slug
        run: |
          p='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${p//\//-}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ env.COMMIT }}
          provenance: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=image-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sakuralaaa/atoll-server
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=""
          for t in $TAGS; do args="$args -t $t"; done
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $args $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}"
