name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation (Sigstore)
      attestations: write # store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - run: sh internal/server/webui/sync.sh
      - run: go test ./...
      # A tagged build must come from exactly the tagged tree. The only allowed difference is the
      # synced panel in internal/server/webui/dist (a build output that replaces a tracked placeholder).
      - name: Check the tree is clean
        run: |
          if [ -n "$(git status --porcelain -- . ':(exclude)internal/server/webui/dist')" ]; then
            git status --porcelain -- . ':(exclude)internal/server/webui/dist'
            echo "::error::release tree is dirty"; exit 1
          fi
      - run: VERSION=${GITHUB_REF_NAME} sh scripts/build-release.sh
      # Signed build provenance for every binary and SHA256SUMS: SHA256SUMS alone only proves
      # a file was not corrupted, not that this workflow built it. Verify with
      #   gh attestation verify atoll-server-linux-amd64 --repo Sakuralaaa/Atoll
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/atoll-*
            dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          notes=""
          # hand-written upgrade notes come first, the generated commit list after them
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then notes="docs/releases/$GITHUB_REF_NAME.md"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes ${notes:+--notes-file "$notes"} --title "Atoll $GITHUB_REF_NAME" $pre
