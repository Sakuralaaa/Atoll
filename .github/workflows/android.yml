name: android
on:
  push:
    branches: [main]
    tags: ['v*']
    # path filters only apply to branch pushes; every v* tag builds
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the APK to the tag's release
    steps:
      # actions are pinned to commit SHAs (tag in the comment); bump them together
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.1.31-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; refusing to publish a debug-signed APK"; exit 1
          else
            echo "::warning::no release keystore; the APK is signed with a throwaway debug key"
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Collect APK
        run: |
          apk="atoll-android-${{ steps.version.outputs.name }}.apk"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/$apk"
          (cd out && sha256sum "$apk" | tee "$apk.sha256")
          echo "APK=out/$apk" >> "$GITHUB_ENV"
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atoll-android-${{ steps.version.outputs.name }}
          path: out/
          if-no-files-found: error
      # The release itself is created by release.yml (Go tests + binaries take a while):
      # wait for it, then attach the APK.
      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            echo "release $GITHUB_REF_NAME not there yet ($i/60), waiting 30s"
            sleep 30
          done
          echo "::error::release $GITHUB_REF_NAME was not created within 30 minutes; re-run this job once release.yml has finished"
          exit 1
